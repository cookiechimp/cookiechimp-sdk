name: Benchmark PR summary

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the PR's code in this privileged workflow.
      - name: Download data only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --name benchmark-evidence --dir evidence
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'evidence/ci.json';
            if (fs.statSync(path).size > 1024 * 1024) throw new Error('Oversized benchmark data');
            const evidence = JSON.parse(fs.readFileSync(path, 'utf8'));
            const run = context.payload.workflow_run;
            const linked = run.pull_requests?.[0];
            if (!linked) return;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: linked.number });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) return;
            if (!Array.isArray(evidence.samples) || evidence.samples.length > 200) throw new Error('Invalid benchmark data');
            const fixtures = new Set(['baseline', 'cookiechimp', 'cookieyes', 'vanilla']);
            if (evidence.samples.some(s => !fixtures.has(s.fixture) || !['passed', 'failed'].includes(s.status))) throw new Error('Invalid sample');
            const passed = evidence.samples.filter(s => s.status === 'passed').length;
            const body = `<!-- cookiechimp-benchmark -->\nBenchmark smoke check: **${passed}/${evidence.samples.length} attempts passed** on ${run.head_sha.slice(0, 7)}.\n\nThis checks fixture operation and consent persistence. Two runs per fixture do not establish a performance ranking, and this PR check does not run Lighthouse. [Raw evidence and logs](${run.html_url}). Run the Benchmark workflow manually with 10 samples for the full lab comparison.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr.number, per_page: 100 });
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- cookiechimp-benchmark -->'));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
